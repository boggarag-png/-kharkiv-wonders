<style>

@font-face{font-family:'Manrope';font-weight:400 500;src:url('../fonts/montserrat-cyrillic-400-normal.woff2') format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+2116}
@font-face{font-family:'Manrope';font-weight:400 500;src:url('../fonts/montserrat-latin-400-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Manrope';font-weight:600 800;src:url('../fonts/montserrat-cyrillic-600-normal.woff2') format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+2116}

/* вбудовування в головний сайт: власний інтерфейс мапи ховаємо, лишаємо тільки мітки */
body.embed .brand, body.embed .dock, body.embed .toast{display:none!important}
body.embed .loader{display:none}
body.nopins #pins{opacity:0;pointer-events:none}

/* мітки — лише номери, без назв (сюрприз!) */
.pin{padding:4px}

.pin.next .num{animation:nextPulse 1.3s ease-in-out infinite}
@keyframes nextPulse{0%,100%{box-shadow:0 0 14px var(--gold-glow),0 0 0 0 rgba(255,212,59,.7)}50%{box-shadow:0 0 22px var(--gold-glow),0 0 0 12px rgba(255,212,59,0)}}

<style>
/* Layout: full-bleed night-city WebGL map; floating pins over landmarks; choice pill docked bottom-centre, detail card above it. One deliberate night look. */
:root{
  --bg:#04060b;
  --ink:#ffffff;
  --ink-2:rgba(255,255,255,.66);
  --ink-inv:#14161c;
  --panel:rgba(9,12,20,.84);
  --line:rgba(255,255,255,.12);
  --gold:#ffd43b;
  --gold-glow:rgba(255,212,59,.75);
  --river:#2a7bff;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#pins{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border:0;border-radius:999px;background:transparent;
  color:var(--ink);font:600 12px/1 var(--f-display);letter-spacing:.01em;white-space:nowrap;cursor:pointer;pointer-events:auto;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.8);transition:background .2s,color .2s,opacity .3s;will-change:transform}
.pin .num{width:22px;height:22px;flex:none;border-radius:50%;background:var(--gold);color:var(--ink-inv);display:grid;place-items:center;font-size:11px;font-weight:800;text-shadow:none;box-shadow:0 0 14px var(--gold-glow)}
.pin:hover,.pin.hot{background:rgba(9,12,20,.6)}
.pin.sel{background:var(--gold);color:var(--ink-inv);text-shadow:none}
.pin.sel .num{background:var(--ink-inv);color:var(--gold);box-shadow:none}
.pin.dim{opacity:.55}
.pin:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.brand{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 20px);left:max(20px,calc(env(safe-area-inset-left,0px) + 16px));pointer-events:none}
.brand b{display:block;font:800 22px/1 var(--f-display);letter-spacing:.04em}
.brand span{display:block;margin-top:6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.dock{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:max-content;max-width:calc(100vw - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.card{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.card .big{grid-row:span 3;width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--ink-inv);display:grid;place-items:center;font:800 18px var(--f-display);box-shadow:0 0 22px var(--gold-glow)}
.card h2{margin:2px 0 0;font:600 17px/1.25 var(--f-display);text-wrap:balance}
.card p{margin:2px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.card .back{justify-self:start;margin-top:6px;background:none;border:0;padding:0;color:var(--gold);font:700 13px var(--f-body);cursor:pointer}
.card .back:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.pill{display:flex;align-items:center;gap:22px;padding:9px 9px 9px 30px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.45);max-width:100%}
.pill .msg{font:700 19px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.go{flex:none;border:0;border-radius:999px;padding:17px 28px;background:var(--gold);color:var(--ink-inv);font:800 19px/1 var(--f-body);cursor:pointer;
  box-shadow:0 0 0 0 var(--gold-glow);transition:transform .15s,opacity .25s,box-shadow .3s}
.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 26px var(--gold-glow)}
.go:disabled{opacity:.4;cursor:not-allowed}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.toast{position:fixed;z-index:5;left:50%;top:calc(env(safe-area-inset-top,0px) + 22px);transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--gold);color:var(--ink-inv);font:700 14px var(--f-body);transition:opacity .4s}
.loader{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:var(--bg);transition:opacity .9s}
.loader div{text-align:center}
.loader b{display:block;font:800 26px var(--f-display);letter-spacing:.04em}
.loader span{display:block;margin-top:10px;font-size:13px;color:var(--ink-2)}
.loader .err{color:var(--gold)}
@media (max-width:640px){
  .brand b{font-size:17px}
  .pill{gap:12px;padding:7px 7px 7px 18px}
  .pill .msg{font-size:14px}
  .go{font-size:15px;padding:13px 18px}
  .pin{font-size:10.5px;gap:5px}
  .pin .num{width:19px;height:19px;font-size:10px}
  .card h2{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.loader,.toast,.pin{transition:none}}
</style>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(1654);
const R = (a, b) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 640 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 900); // велика сенсорна дошка — повна якість
const Q = small ? { pr: Math.min(devicePixelRatio, 1.6), ext: 2400, trees: 0.45, cars: 0.5, msaa: 0 } : { pr: Math.min(devicePixelRatio, 2), ext: 2900, trees: 1, cars: 1, msaa: 0 };

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.pr); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
$('#stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOG = new THREE.Color('#0a1222'), FOGD = 0.00027;
scene.fog = new THREE.FogExp2(FOG, FOGD);
const camera = new THREE.PerspectiveCamera(innerWidth / innerHeight < 0.9 ? 55 : 40, innerWidth / innerHeight, 4, 24000);
const U = { uTime: { value: 0 }, uFogColor: { value: FOG }, uFogDensity: { value: FOGD }, uMoon: { value: new THREE.Vector3(-0.45, 0.62, 0.55).normalize() } };
scene.add(new THREE.HemisphereLight(0x40507a, 0x0b0906, 0.9));
const moon = new THREE.DirectionalLight(0x9fb4e6, 0.55); moon.position.copy(U.uMoon.value).multiplyScalar(1000); scene.add(moon);

/* ---------- city plan in warped (u,v) space ---------- */
const S = 110, EXT = Q.ext, NL = Math.ceil(EXT / S) + 1;
const W = (u, v) => [u + 70 * Math.sin(v / 760) + 35 * Math.sin((u + v) / 430), v + 60 * Math.sin(u / 690) + 30 * Math.cos((u - v) / 510)];
const Wang = (u, v) => { const a = W(u, v), b = W(u + 1, v); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
const isAve = k => ((k % 5) + 5) % 5 === 0;
const hwOf = k => isAve(k) ? 13 : 6.5;

function curveUV(pts, step) {
  const c = new THREE.CatmullRomCurve3(pts.map(([u, v]) => new THREE.Vector3(u, 0, v)), false, 'centripetal');
  const n = Math.ceil(c.getLength() / step);
  return c.getSpacedPoints(n).map(p => [p.x, p.z]);
}
const RIVERS = [
  { hw: 32, uv: curveUV([[-1300,-3300],[-1050,-2200],[-860,-1400],[-730,-650],[-690,0],[-720,560],[-690,900],[-520,1180],[-180,1480],[250,1720],[800,2150],[1400,2700],[1800,3300]], 8) },
  { hw: 36, uv: curveUV([[2600,-3100],[1800,-2000],[1250,-1150],[1020,-300],[960,450],[900,1100],[650,1600],[400,1830],[250,1725]], 8) },
];
const RAILS = [
  curveUV([[-3300,1350],[-1800,1260],[-900,1300],[-300,1390],[400,1330],[1200,1250],[2000,1150],[3300,950]], 8),
  curveUV([[1200,1250],[1750,600],[2150,-300],[2500,-1400],[3000,-2700]], 8),
  curveUV([[-900,1300],[-1400,600],[-1700,-400],[-2200,-1600],[-2800,-3100]], 8),
];
// coarse distance fields
const G = 20, OFF = 3400, GN = Math.ceil(2 * OFF / G);
function field(polys, radius) {
  const f = new Float32Array(GN * GN).fill(1e9), r = Math.ceil(radius / G);
  for (const { uv, hw } of polys) for (const [u, v] of uv) {
    const ci = Math.floor((u + OFF) / G), cj = Math.floor((v + OFF) / G);
    for (let i = ci - r; i <= ci + r; i++) for (let j = cj - r; j <= cj + r; j++) {
      if (i < 0 || j < 0 || i >= GN || j >= GN) continue;
      const d = Math.hypot((i + 0.5) * G - OFF - u, (j + 0.5) * G - OFF - v) - hw, k = j * GN + i;
      if (d < f[k]) f[k] = d;
    }
  }
  return f;
}
const sampleF = (f, u, v) => { const i = Math.floor((u + OFF) / G), j = Math.floor((v + OFF) / G); return (i < 0 || j < 0 || i >= GN || j >= GN) ? 1e9 : f[j * GN + i]; };
const RF = field(RIVERS, 260), TF = field(RAILS.map(uv => ({ uv, hw: 5 })), 120);
const riverD = (u, v) => sampleF(RF, u, v), railD = (u, v) => sampleF(TF, u, v);

const ZONES = [
  { id: 'shev', r: [-310, -22, -330, 60], park: true, road: true },
  { id: 'gorky', r: [30, 430, -1760, -1080], park: true, road: true },
  { id: 'svob', r: [236, 364, -470, -130], road: true },
  { id: 'svobC', c: [300, -470, 64], road: true },
  { id: 'derzh', r: [140, 460, -690, -540], road: true },
  { id: 'mirror', r: [-122, -20, 228, 350], park: true, road: true },
  { id: 'cath', c: [-545, 820, 72], road: true },
  { id: 'slovo', c: [560, -800, 76], road: true },
  { id: 'vokzal', r: [-1250, -1050, 1095, 1240], road: true },
];
function zoneHit(z, u, v, pad = 0) {
  if (z.r) return u > z.r[0] - pad && u < z.r[1] + pad && v > z.r[2] - pad && v < z.r[3] + pad;
  return Math.hypot(u - z.c[0], v - z.c[1]) < z.c[2] + pad;
}
function rectHitsZone(z, u0, u1, v0, v1, pad) {
  if (z.r) return u1 > z.r[0] - pad && u0 < z.r[1] + pad && v1 > z.r[2] - pad && v0 < z.r[3] + pad;
  const cu = clamp(z.c[0], u0, u1), cv = clamp(z.c[1], v0, v1); return Math.hypot(cu - z.c[0], cv - z.c[1]) < z.c[2] + pad;
}
const inAnyZone = (u, v, pad = 0) => ZONES.some(z => zoneHit(z, u, v, pad));

/* ---------- buildings ---------- */
const BOX = [];   // {u,v,w,d,h,y0,col,rot}
const TREES = []; // {x,z,r}
const tHash = new Map(), TC = 6;
function treeFree(x, z, md) {
  const cx = Math.floor(x / TC), cz = Math.floor(z / TC), rr = Math.ceil(md / TC);
  for (let i = -rr; i <= rr; i++) for (let j = -rr; j <= rr; j++) { const a = tHash.get((cx + i) * 100003 + cz + j); if (a) for (const t of a) if ((t.x - x) ** 2 + (t.z - z) ** 2 < md * md) return false; }
  return true;
}
function addTreeW(x, z, r) { const t = { x, z, r }; TREES.push(t); const k = Math.floor(x / TC) * 100003 + Math.floor(z / TC); if (!tHash.has(k)) tHash.set(k, []); tHash.get(k).push(t); }
function addTreeUV(u, v, r, md = 5) { if (rand() > Q.trees) return; const [x, z] = W(u, v); if (treeFree(x, z, md)) addTreeW(x, z, r); }

const HIST = ['#d8c6a2', '#cbb08a', '#c1b8aa', '#e2d6c0', '#a8705a', '#cfc4b0', '#b9a58e', '#d9cbb6'];
const PANEL = ['#c6cacf', '#d6d4cc', '#b7bcc2', '#ddd8ca', '#c9c3b6'];
const pushBox = (u, v, w, d, h, col, rot = 0, y0 = 0) => { if (w >= 5 && d >= 5 && h > 2) BOX.push({ u, v, w, d, h, col, rot, y0 }); };
const floors = (a, b, fh = 3.3) => RI(a, b) * fh;

for (let i = -NL; i < NL; i++) for (let j = -NL; j < NL; j++) {
  const u0 = i * S, u1 = u0 + S, v0 = j * S, v1 = v0 + S, uc = (u0 + u1) / 2, vc = (v0 + v1) / 2;
  const dist = Math.hypot(uc, vc - 100);
  if (Math.hypot(uc, vc) > EXT - 40) continue;
  if (dist > EXT - 600 && rand() < (dist - (EXT - 600)) / 600) continue;
  if (ZONES.some(z => rectHitsZone(z, u0, u1, v0, v1, -2))) continue;
  if (riverD(uc, vc) < 60 || [[u0, v0], [u1, v0], [u0, v1], [u1, v1]].some(([a, b]) => riverD(a, b) < 12)) {
    for (let k = 0; k < 10; k++) { const a = R(u0, u1), b = R(v0, v1), rd = riverD(a, b); if (rd > 8 && rd < 70) addTreeUV(a, b, R(3, 5)); }
    continue;
  }
  if (railD(uc, vc) < 45 || [[u0, v0], [u1, v0], [u0, v1], [u1, v1]].some(([a, b]) => railD(a, b) < 18)) continue;
  const ua = u0 + hwOf(i) + (isAve(i) ? 7 : 1.5), ub = u1 - hwOf(i + 1) - (isAve(i + 1) ? 7 : 1.5);
  const va = v0 + hwOf(j) + (isAve(j) ? 7 : 1.5), vb = v1 - hwOf(j + 1) - (isAve(j + 1) ? 7 : 1.5);
  const W_ = ub - ua, H_ = vb - va;
  if (rand() < 0.045) { for (let k = 0; k < 40; k++) addTreeUV(R(ua, ub), R(va, vb), R(3, 5.5)); continue; }
  if (dist < 1150 || (dist < 1800 && rand() < 0.55)) {
    // historic perimeter block: a street wall of buildings of different heights
    const D = R(12, 16), base = dist < 700 ? RI(4, 6) : RI(5, 9), col0 = pick(dist < 1150 ? HIST : PANEL);
    const seg = (a0, a1, along) => {
      let a = a0;
      while (a < a1 - 6) {
        const L = Math.min(a1 - a, R(16, 40)); if (a1 - a - L < 10) { }
        if (rand() > 0.08) {
          let fl = clamp(base + RI(-1, 2), 3, 14); if (rand() < 0.04) fl += RI(4, 9);
          const col = rand() < 0.65 ? col0 : pick(HIST), m = (a + a + L) / 2;
          along(m, L, fl * 3.3, col);
        }
        a += L;
      }
    };
    seg(ua, ub, (m, L, h, c) => pushBox(m, va + D / 2, L, D, h, c));
    seg(ua, ub, (m, L, h, c) => pushBox(m, vb - D / 2, L, D, h, c));
    seg(va + D, vb - D, (m, L, h, c) => pushBox(ua + D / 2, m, D, L, h, c));
    seg(va + D, vb - D, (m, L, h, c) => pushBox(ub - D / 2, m, D, L, h, c));
    if (rand() < 0.3) pushBox(uc + R(-10, 10), vc + R(-10, 10), R(14, 24), R(12, 20), floors(2, 4), col0);
    for (let k = 0; k < 7; k++) { const a = R(ua + D + 4, ub - D - 4), b = R(va + D + 4, vb - D - 4); addTreeUV(a, b, R(3, 5), 6); }
  } else {
    const r = rand(), rects = [];
    const col = pick(PANEL);
    if (r < 0.5) { // panel slabs
      const rot = rand() < 0.5, n = Math.max(1, Math.floor((rot ? W_ : H_) / 36));
      for (let k = 0; k < n; k++) {
        const t = (k + 0.5) / n, L = Math.min((rot ? H_ : W_) - 8, R(50, 92)), h = floors(9, 16, 2.9);
        if (rot) { const u = lerp(ua, ub, t); pushBox(u, vc, 13, L, h, col); rects.push([u - 9, u + 9, vc - L / 2, vc + L / 2]); }
        else { const v = lerp(va, vb, t); pushBox(uc, v, L, 13, h, col); rects.push([uc - L / 2, uc + L / 2, v - 9, v + 9]); }
      }
    } else if (r < 0.82) { // point towers
