  addEventListener('unhandledrejection', function (e) { fail(e.reason && e.reason.message ? e.reason.message : String(e.reason)); });
})();

/* ---------- directional, moon-tinted fog (aerial perspective) ---------- */
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying float vFogDepth; varying vec3 vFogView;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
vFogDepth = - mvPosition.z; vFogView = mvPosition.xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogView;

#ifdef FOG_EXP2

#else

#endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
#ifdef FOG_EXP2
float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
#else
float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
#endif
float fogSun = pow( max( dot( normalize( vFogView ), uFogSunView ), 0.0 ), 5.0 );
gl_FragColor.rgb = mix( gl_FragColor.rgb, mix( fogColor, uFogSunColor, fogSun ), fogFactor );
#endif`;
const FOGU = { v: { value: new THREE.Vector3(0, 0, -1) }, c: { value: new THREE.Color() } };
const fogPatch = s => { s.uniforms.uFogSunView = FOGU.v; s.uniforms.uFogSunColor = FOGU.c; };
const fogUniforms = (extra) => { const u = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, extra || {}]); u.uFogSunView = FOGU.v; u.uFogSunColor = FOGU.c; return u; };
const MATS = [];
function std(p, envK = 1) { const m = new THREE.MeshStandardMaterial(p); m.onBeforeCompile = fogPatch; m.userData.envK = envK; MATS.push(m); return m; }
function basic(p) { const m = new THREE.MeshBasicMaterial(p); m.onBeforeCompile = fogPatch; return m; }
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

/* спільні «живі» величини для шейдерів: час, колір підводних вогнів, водне шоу, висота струменя */
const TIME = { value: 0 }, LC = { value: new THREE.Color('#2a6cff') }, SHOW = { value: 0 }, JETH = { value: 9 };
const WY = 0.25;            // рівень води в басейні
const TH = 4.5;             // висота тераси з ротондою
const RC = new THREE.Vector3(0, TH, -29); // центр ротонди

/* GLSL: шум і каустика (світлові «зайчики» від води) */
const GLSL_NOISE = `
float wn_hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float wn_noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(wn_hash(i), wn_hash(i + vec2(1.0, 0.0)), u.x), mix(wn_hash(i + vec2(0.0, 1.0)), wn_hash(i + vec2(1.0, 1.0)), u.x), u.y); }`;
const GLSL_CAUS = `
float cz_caustic(vec2 uv, float time){
  vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });

renderer.setSize(innerWidth, innerHeight);

$('#stage').appendChild(renderer.domElement);
const MAXANI = Math.min(16, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a2747, 0.0042);
const camera = new THREE.PerspectiveCamera(innerWidth / innerHeight < 0.9 ? 52 : 36, innerWidth / innerHeight, 0.3, 6000);

/* ---------- canvas texture helpers ---------- */
function cnv(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- materials ---------- */
const whiteMat = std({ map: STONE, color: 0xf6f1e8, roughness: 0.62 });
const graniteMat = std({ map: GRAN, color: 0xc0b0a4, roughness: 0.5 }, 0.8);
const concMat = std({ map: CONC, color: 0xb8b3a8, roughness: 0.92 }, 0.5);
const glassMat = std({ map: OG.map, emissiveMap: OG.em, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.18, metalness: 0.4 }, 1.4);
const bronzeMat = std({ color: 0x8c6a3a, metalness: 1, roughness: 0.38 }, 1.4);
const darkMat = std({ color: 0x15171a, roughness: 0.8 }, 0.4);
const cityMat = std({ map: CA.map, emissiveMap: CA.em, emissive: 0xffffff, emissiveIntensity: 1.3, roughness: 0.8 });

/* підсвічування (запечене в матеріали): прожектори, світло з-під води, каустика */
const LIT = {

    vec3 N = normalize(vFN); vec3 P = vFW;
    vec2 rel = P.xz - vec2(0.0, -29.0); float rl = max(length(rel), 1e-3);
    float hl = length(N.xz);
    float outw = hl > 0.01 ? dot(N.xz / hl, rel / rl) : 0.0;
    float hy = P.y - 4.5;
    float front = 0.5 + 0.5 * rel.y / rl;
    float fl = max(outw, 0.0) * (0.3 + 0.7 * front) * mix(1.0, 0.6, smoothstep(1.0, 11.0, hy)) * hl;
