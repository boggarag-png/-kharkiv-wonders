<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { autoQuality } from '../js/perf.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(19251928);
const R = (a, b) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 640 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 900); // велика сенсорна дошка — повна якість
const Q = small
  ? { shadow: 2048, trees: 0.5, pr: Math.min(devicePixelRatio, 1.6), plan: 2048, msaa: 0 }
  : { shadow: 4096, trees: 1.0, pr: Math.min(devicePixelRatio, 2), plan: 4096, msaa: 4 };

/* ---------- directional, sun-tinted fog (aerial perspective) ---------- */
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying float vFogDepth; varying vec3 vFogView;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
vFogDepth = - mvPosition.z; vFogView = mvPosition.xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogView;
uniform vec3 uFogSunView; uniform vec3 uFogSunColor;
#ifdef FOG_EXP2
uniform float fogDensity;
#else
uniform float fogNear; uniform float fogFar;
#endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
#ifdef FOG_EXP2
float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
#else
float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
#endif
float fogSun = pow( max( dot( normalize( vFogView ), uFogSunView ), 0.0 ), 5.0 );
gl_FragColor.rgb = mix( gl_FragColor.rgb, mix( fogColor, uFogSunColor, fogSun ), fogFactor );
#endif`;
const FOGU = { v: { value: new THREE.Vector3(0, 0, -1) }, c: { value: new THREE.Color() } };
const fogPatch = s => { s.uniforms.uFogSunView = FOGU.v; s.uniforms.uFogSunColor = FOGU.c; };
const MATS = [];
function std(p, envK = 1) { const m = new THREE.MeshStandardMaterial(p); m.onBeforeCompile = fogPatch; m.userData.envK = envK; MATS.push(m); return m; }
function basic(p) { const m = new THREE.MeshBasicMaterial(p); m.onBeforeCompile = fogPatch; return m; }

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('#stage').appendChild(renderer.domElement);
const MAXANI = Math.min(16, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd7a888, 0.0012);
const camera = new THREE.PerspectiveCamera(innerWidth / innerHeight < 0.9 ? 52 : 36, innerWidth / innerHeight, 2, 9000);

/* ---------- canvas texture helpers ---------- */
function cnv(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctex(c, srgb = true, repeat = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAXANI; t.needsUpdate = true; return t;
}
function grain(ctx, w, h, amt) {
  const d = ctx.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const n = (rand() - 0.5) * amt; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  ctx.putImageData(d, 0, 0);
}
const noiseCanvas = (() => { const c = cnv(256), g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256); grain(g, 256, 256, 70); return c; })();

/* Derzhprom facade atlas: 8x8 cells, one cell = one bay (4 m) x one floor (4 m) */
const BW = 4, FH = 4, ATL = 8;
function facadeAtlas() {
  const S = 1024, N = 8, C = S / N;
  const cA = cnv(S), cE = cnv(S), cO = cnv(S), cN = cnv(S);
  const a = cA.getContext('2d'), e = cE.getContext('2d'), o = cO.getContext('2d'), n = cN.getContext('2d');
  a.fillStyle = '#dcd7cc'; a.fillRect(0, 0, S, S); grain(a, S, S, 16);
  for (let i = 0; i < 90; i++) { a.fillStyle = rand() < 0.55 ? `rgba(110,100,86,${R(.025,.06)})` : `rgba(255,252,244,${R(.03,.07)})`; a.beginPath(); a.arc(R(0,S), R(0,S), R(20,110), 0, 7); a.fill(); }
  e.fillStyle = '#000'; e.fillRect(0, 0, S, S);
  o.fillStyle = 'rgb(0,215,0)'; o.fillRect(0, 0, S, S);
  n.fillStyle = 'rgb(128,128,255)'; n.fillRect(0, 0, S, S);
  const tones = [[34,44,56],[42,54,68],[28,36,46],[54,66,80],[64,72,80],[40,48,56],[48,58,66]];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x0 = i * C, y0 = j * C, mx = C * 0.1, top = C * 0.09, bot = C * 0.2;
    const wx = x0 + mx, wy = y0 + top, ww = C - 2 * mx, wh = C - top - bot, lw = Math.max(2, C * 0.024);
    a.fillStyle = 'rgba(80,70,60,0.16)'; a.fillRect(x0, y0 + C - 3, C, 3);
    const st = a.createLinearGradient(0, wy + wh, 0, wy + wh + bot * 1.4);
    st.addColorStop(0, 'rgba(70,62,52,0.22)'); st.addColorStop(1, 'rgba(70,62,52,0)');
    a.fillStyle = st; a.fillRect(wx + ww * 0.15, wy + wh, ww * 0.7, bot * 1.4);
    const t = pick(tones), k = R(.85, 1.2);
    const gg = a.createLinearGradient(0, wy, 0, wy + wh);
    gg.addColorStop(0, `rgb(${t[0]*k*1.7|0},${t[1]*k*1.7|0},${t[2]*k*1.7|0})`);
    gg.addColorStop(1, `rgb(${t[0]*k|0},${t[1]*k|0},${t[2]*k|0})`);
    a.fillStyle = gg; a.fillRect(wx, wy, ww, wh);
    if (rand() < 0.35) { a.fillStyle = `rgba(205,195,172,${R(.18,.4)})`; const cw = ww * R(.15,.45); a.fillRect(rand() < .5 ? wx : wx + ww - cw, wy, cw, wh); }
    a.fillStyle = 'rgba(0,0,0,0.32)'; a.fillRect(wx, wy, ww, C * 0.035); a.fillRect(wx, wy, C * 0.025, wh);
    if (rand() < 0.36) {
      const warm = rand() < 0.75, b = R(.4, 1), part = rand() < 0.25 ? R(.4, .8) : 1;
      e.fillStyle = warm ? `rgb(${255*b|0},${186*b|0},${105*b|0})` : `rgb(${195*b|0},${222*b|0},${255*b|0})`;
      e.fillRect(wx, wy + wh * (1 - part), ww, wh * part);
    }
    o.fillStyle = 'rgb(0,24,190)'; o.fillRect(wx, wy, ww, wh);
    n.fillStyle = 'rgb(128,62,215)'; n.fillRect(wx, wy, ww, lw * 1.6);
    n.fillStyle = 'rgb(128,194,215)'; n.fillRect(wx, wy + wh - lw * 1.6, ww, lw * 1.6);
    n.fillStyle = 'rgb(194,128,215)'; n.fillRect(wx, wy, lw * 1.6, wh);
    n.fillStyle = 'rgb(62,128,215)'; n.fillRect(wx + ww - lw * 1.6, wy, lw * 1.6, wh);
    const mull = (ctx, col) => {
      ctx.fillStyle = col;
      for (let q = 1; q < 3; q++) ctx.fillRect(wx + ww * q / 3 - lw / 2, wy, lw, wh);
      ctx.fillRect(wx, wy + wh * 0.3 - lw / 2, ww, lw); ctx.fillRect(wx, wy + wh * 0.66 - lw / 2, ww, lw);
      ctx.fillRect(wx, wy, ww, lw); ctx.fillRect(wx, wy + wh - lw, ww, lw); ctx.fillRect(wx, wy, lw, wh); ctx.fillRect(wx + ww - lw, wy, lw, wh);
    };
    mull(a, '#e9e4d9'); mull(e, '#000'); mull(o, 'rgb(0,150,0)');
    a.fillStyle = 'rgba(255,255,255,0.35)'; a.fillRect(wx - 1, wy + wh, ww + 2, 2);
  }
  return { map: ctex(cA), em: ctex(cE), orm: ctex(cO, false), nrm: ctex(cN, false) };
}

/* curtain wall for the portal and the glazed stair shafts: one tile = 1 bay x 1 floor */
function curtainTex() {
  const S = 256, cA = cnv(S), cE = cnv(S), cO = cnv(S);
  const a = cA.getContext('2d'), e = cE.getContext('2d'), o = cO.getContext('2d');
  const gg = a.createLinearGradient(0, 0, 0, S); gg.addColorStop(0, '#6f8598'); gg.addColorStop(1, '#3b4a58');
  a.fillStyle = gg; a.fillRect(0, 0, S, S);
  e.fillStyle = '#5a3c1c'; e.fillRect(0, 0, S, S);
  o.fillStyle = 'rgb(0,18,200)'; o.fillRect(0, 0, S, S);
  for (const [ctx, col] of [[a, '#e4dfd4'], [e, '#000'], [o, 'rgb(0,140,0)']]) {
    ctx.fillStyle = col;
    for (let i = 0; i <= 4; i++) ctx.fillRect(i * S / 4 - 3, 0, 6, S);
    for (let j = 0; j <= 3; j++) ctx.fillRect(0, j * S / 3 - 2, S, 4);
    ctx.fillRect(0, S - 18, S, 18);
  }
  const ts = [ctex(cA), ctex(cE), ctex(cO, false)];
  ts.forEach(t => t.repeat.set(ATL, ATL));
  return { map: ts[0], em: ts[1], orm: ts[2] };
}

/* residential atlas for the surrounding city: 8x8 cells, cell = 3.2 m x 3.0 m */
function cityAtlas() {
  const S = 512, N = 8, C = S / N;
  const cA = cnv(S), cE = cnv(S), a = cA.getContext('2d'), e = cE.getContext('2d');
  a.fillStyle = '#ece9e2'; a.fillRect(0, 0, S, S); grain(a, S, S, 18);
  e.fillStyle = '#000'; e.fillRect(0, 0, S, S);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x0 = i * C, y0 = j * C, wx = x0 + C * 0.24, wy = y0 + C * 0.18, ww = C * 0.52, wh = C * 0.5;
    a.fillStyle = 'rgba(0,0,0,0.08)'; a.fillRect(x0, y0 + C - 2, C, 2);
    a.fillStyle = `rgb(${R(30,60)|0},${R(38,66)|0},${R(48,76)|0})`; a.fillRect(wx, wy, ww, wh);
    a.fillStyle = '#d8d4cc'; a.fillRect(wx + ww / 2 - 1, wy, 2, wh);
    if (i % 4 === 1) { a.fillStyle = rand() < 0.5 ? '#cfcac0' : '#9aa0a6'; a.fillRect(x0 + 4, wy + wh * 0.55, C - 8, C * 0.36); }
    if (rand() < 0.3) { const b = R(.45, 1); e.fillStyle = `rgb(${255*b|0},${180*b|0},${100*b|0})`; e.fillRect(wx, wy, ww, wh); }
  }

  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  FOGU.v.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);
  skyU.uTime.value = T; fountainU.uTime.value = T; grade.uniforms.uTime.value = T;
  updateCars(T);
  for (let i = 0; i < flagPos.count; i++) {
    const x = flagBase[i * 3], y = flagBase[i * 3 + 1], k = x / 6.6;
    flagPos.setZ(i, (Math.sin(x * 0.95 - T * 5.2) * 0.42 + Math.sin(x * 1.9 - T * 7.7 + y * 0.6) * 0.12) * k);
    flagPos.setY(i, y - k * k * 0.25);
  }
  flagPos.needsUpdate = true; flag.geometry.computeVertexNormals();
  const blink = (Math.sin(T * 3.2) > 0.2 ? 1 : 0.15);
  AVIA.mat.color.setRGB(1, 0.08, 0.04).multiplyScalar(0.6 + night * 5 * blink);
  composer.render();
  if (first) { first = false; const L = $('#loader'); L.style.opacity = 0; setTimeout(() => L.hidden = true, 950); }
}
frame();
