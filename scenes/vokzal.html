:root{
  --bg:#06080e;
  --ink:#f4efe6;
  --ink-2:rgba(244,239,230,.68);
  --glass-3:rgba(255,255,255,.16);

}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;

#stage{position:fixed;inset:0}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);left:max(22px,calc(env(safe-area-inset-left,0px) + 16px));

.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-weight:700}

.brand p{font-size:13px;line-height:1.5;color:var(--ink-2);margin:0}
.brand p b{color:var(--ink);font-weight:600}
.hint{position:fixed;right:max(22px,calc(env(safe-area-inset-right,0px) + 16px));top:calc(env(safe-area-inset-top,0px) + 26px);
  font-size:12px;line-height:1.6;color:var(--ink-2);text-align:right;transition:opacity 1.2s ease;pointer-events:none;z-index:2;text-shadow:0 1px 10px rgba(0,0,0,.6)}

@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

(function () {
  function fail(msg) {
    var m = document.getElementById('loadmsg'), L = document.getElementById('loader');
    if (m) { m.textContent = 'Не вдалося запустити 3D-сцену: ' + (msg || 'невідома помилка'); m.className = 'err'; }
    if (L) { L.hidden = false; L.style.opacity = 1; }
  }
  addEventListener('error', function (e) { fail(e.message); });
  addEventListener('unhandledrejection', function (e) { fail(e.reason && e.reason.message ? e.reason.message : String(e.reason)); });
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { horn } from '../js/sfx.js';
import { autoQuality } from '../js/perf.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(19521952);
const R = (a, b) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 640 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 900); // велика сенсорна дошка — повна якість
// великі інтерактивні дошки (4K) — обмежуємо кількість пікселів, щоб не гальмувало
const PRCAP = Math.sqrt(8.3e6 / Math.max(1, innerWidth * innerHeight));
const Q = small
  ? { shadow: 2048, trees: 0.55, pr: Math.min(devicePixelRatio, 1.5, PRCAP), plan: 2048, msaa: 0, people: 0.5 }
  : { shadow: 4096, trees: 1.0, pr: Math.min(devicePixelRatio, 2, PRCAP), plan: 4096, msaa: 4, people: 1 };

/* шрифт для світлих літер «ХАРКІВ» на аттику */
try { await Promise.race([document.fonts.load('800 120px Unbounded', 'ХАРКІВ'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}

/* ---------- directional, moon-tinted fog (aerial perspective) ---------- */
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying float vFogDepth; varying vec3 vFogView;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
vFogDepth = - mvPosition.z; vFogView = mvPosition.xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogView;
uniform vec3 uFogSunView; uniform vec3 uFogSunColor;
#ifdef FOG_EXP2
uniform float fogDensity;
#else
uniform float fogNear; uniform float fogFar;
#endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
#ifdef FOG_EXP2
float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
#else
float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
#endif
float fogSun = pow( max( dot( normalize( vFogView ), uFogSunView ), 0.0 ), 5.0 );
gl_FragColor.rgb = mix( gl_FragColor.rgb, mix( fogColor, uFogSunColor, fogSun ), fogFactor );
#endif`;
const FOGU = { v: { value: new THREE.Vector3(0, 0, -1) }, c: { value: new THREE.Color() } };
const fogPatch = s => { s.uniforms.uFogSunView = FOGU.v; s.uniforms.uFogSunColor = FOGU.c; };
const MATS = [];
function std(p, envK = 1) { const m = new THREE.MeshStandardMaterial(p); m.onBeforeCompile = fogPatch; m.userData.envK = envK; MATS.push(m); return m; }
function basic(p) { const m = new THREE.MeshBasicMaterial(p); m.onBeforeCompile = fogPatch; return m; }
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('#stage').appendChild(renderer.domElement);
const MAXANI = Math.min(16, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1020, 0.00105);
const camera = new THREE.PerspectiveCamera(innerWidth / innerHeight < 0.9 ? 52 : 36, innerWidth / innerHeight, 2, 9000);

/* ---------- canvas texture helpers ---------- */
function cnv(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctex(c, srgb = true, repeat = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAXANI; t.needsUpdate = true; return t;
}
function grain(ctx, w, h, amt) {
  const d = ctx.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const n = (rand() - 0.5) * amt; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  ctx.putImageData(d, 0, 0);
}
const noiseCanvas = (() => { const c = cnv(256), g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256); grain(g, 256, 256, 70); return c; })();

/* ---------- station facade atlas ----------
   one texture = 8 bays (6 m each, 48 m) x 24 m of height; real metres map straight to UVs.
   ground floor: rusticated, tall arched windows; upper floor: smaller arched windows with balustrade panels; attic: square windows */
const AW = 48, AH = 24, BAY = 6;
function wingAtlas() {
  const W = 2048, H = 1024, k = W / AW;
  const cA = cnv(W, H), cE = cnv(W, H), cO = cnv(W, H);
  const a = cA.getContext('2d'), e = cE.getContext('2d'), o = cO.getContext('2d');
  const X = x => x * k, Y = y => (AH - y) * k;
  const rect = (ctx, x0, y0, x1, y1) => ctx.fillRect(X(x0), Y(y1), (x1 - x0) * k, (y1 - y0) * k);
  const arch = (ctx, cx, y0, ys, r) => { ctx.beginPath(); ctx.moveTo(X(cx - r), Y(y0)); ctx.lineTo(X(cx - r), Y(ys)); ctx.arc(X(cx), Y(ys), r * k, Math.PI, 0, false); ctx.lineTo(X(cx + r), Y(y0)); ctx.closePath(); };
  a.fillStyle = '#e4cf9f'; a.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) { a.fillStyle = rand() < 0.55 ? `rgba(120,96,60,${R(.025,.06)})` : `rgba(255,248,230,${R(.03,.07)})`; a.beginPath(); a.arc(R(0, W), R(0, H), R(20, 120), 0, 7); a.fill(); }
  e.fillStyle = '#000'; e.fillRect(0, 0, W, H);
  o.fillStyle = 'rgb(0,215,0)'; o.fillRect(0, 0, W, H);
  const WHITE = '#f3ecdc', GLASS = ['#1b2330', '#222b38', '#18202a', '#2a3340'];
  // rusticated ground floor
  a.fillStyle = 'rgba(110,84,50,0.2)';
  for (let y = 1.2; y < 8.8; y += 0.72) rect(a, 0, y, AW, y + 0.05);
  rect(a, 0, 0, AW, 1.2); a.fillStyle = '#857b6e'; rect(a, 0, 0, AW, 1.15);
  const litWin = (ctx, b, warm) => warm ? `rgb(${255 * b | 0},${178 * b | 0},${96 * b | 0})` : `rgb(${200 * b | 0},${220 * b | 0},${255 * b | 0})`;
  function window(cx, y0, ys, r, pLit, mullY) {
    // white archivolt surround
    a.fillStyle = WHITE; arch(a, cx, y0 - 0.12, ys, r + 0.26); a.fill();
    a.fillStyle = 'rgba(120,96,60,0.25)'; arch(a, cx, y0 - 0.12, ys, r + 0.27); a.lineWidth = 2; a.strokeStyle = 'rgba(120,96,60,0.3)'; a.stroke();
    // keystone
    a.fillStyle = WHITE; a.beginPath(); a.moveTo(X(cx - 0.32), Y(ys + r + 0.5)); a.lineTo(X(cx + 0.32), Y(ys + r + 0.5)); a.lineTo(X(cx + 0.2), Y(ys + r - 0.1)); a.lineTo(X(cx - 0.2), Y(ys + r - 0.1)); a.closePath(); a.fill();
    // glass
    const gg = a.createLinearGradient(0, Y(ys + r), 0, Y(y0)); const gc = pick(GLASS);
    gg.addColorStop(0, '#3a4656'); gg.addColorStop(1, gc); a.fillStyle = gg; arch(a, cx, y0, ys, r); a.fill();
    o.fillStyle = 'rgb(0,30,180)'; arch(o, cx, y0, ys, r); o.fill();
    if (rand() < pLit) {
      const warm = rand() < 0.85, b = R(0.55, 1);
      const eg = e.createLinearGradient(0, Y(ys + r), 0, Y(y0));
      eg.addColorStop(0, litWin(e, b, warm)); eg.addColorStop(1, litWin(e, b * R(0.6, 0.85), warm));
      e.fillStyle = eg; arch(e, cx, y0, ys, r); e.fill();
      if (rand() < 0.3) { e.fillStyle = 'rgba(0,0,0,0.55)'; const cw = r * R(0.5, 1.0); rect(e, rand() < .5 ? cx - r : cx + r - cw, y0, rand() < .5 ? cx - r + cw : cx + r, ys); }
    }
    // mullions & transom
    for (const [ctx, col] of [[a, '#efe7d6'], [e, '#000'], [o, 'rgb(0,150,0)']]) {
      ctx.fillStyle = col; ctx.strokeStyle = col; const lw = 0.07;
      rect(ctx, cx - lw, y0, cx + lw, ys + r);
      rect(ctx, cx - r, ys - lw, cx + r, ys + lw);
      for (const my of mullY) rect(ctx, cx - r, my - lw * 0.8, cx + r, my + lw * 0.8);
      ctx.lineWidth = lw * k * 1.6;
      for (const ang of [Math.PI * 0.25, Math.PI * 0.75]) { ctx.beginPath(); ctx.moveTo(X(cx), Y(ys)); ctx.lineTo(X(cx + Math.cos(ang) * r), Y(ys + Math.sin(ang) * r)); ctx.stroke(); }
      ctx.lineWidth = lw * k * 2; arch(ctx, cx, y0, ys, r); ctx.stroke();
    }
    // sill shadow
    a.fillStyle = 'rgba(70,52,30,0.25)'; rect(a, cx - r * 0.8, y0 - 0.7, cx + r * 0.8, y0 - 0.12);
    a.fillStyle = WHITE; rect(a, cx - r - 0.35, y0 - 0.22, cx + r + 0.35, y0 - 0.06);
  }
  for (let i = 0; i < AW / BAY; i++) {
    const x0 = i * BAY, cx = x0 + BAY / 2;
    // pilaster strips (3D pilasters sit on top, this is their soft halo)
    a.fillStyle = '#ecdcb6'; rect(a, x0, 1.2, x0 + 0.55, AH); rect(a, x0 + BAY - 0.55, 1.2, x0 + BAY, AH);
    window(cx, 1.6, 6.5, 1.35, 0.82, [3.4, 5.0]);
    // upper floor balustrade panel
    a.fillStyle = WHITE; rect(a, cx - 1.45, 9.35, cx + 1.45, 10.25);
    a.fillStyle = 'rgba(90,70,40,0.32)'; for (let q = 0; q < 9; q++) { const bx = cx - 1.3 + q * 0.325; rect(a, bx + 0.1, 9.5, bx + 0.2, 10.05); }
    window(cx, 10.6, 13.3, 1.05, 0.5, [12.0]);
    // frieze rosettes
    a.fillStyle = WHITE; for (const fx of [cx, x0 + 0.01, x0 + BAY]) { a.beginPath(); a.arc(X(fx), Y(15.55), 0.24 * k, 0, 7); a.fill(); }
    a.fillStyle = 'rgba(90,70,40,0.25)'; rect(a, 0, 15.05, AW, 15.1); rect(a, 0, 16.0, AW, 16.05);
    // attic: square window + recessed panel
    a.fillStyle = WHITE; rect(a, cx - 1.15, 18.3, cx + 1.15, 20.4);
    a.fillStyle = pick(GLASS); rect(a, cx - 0.95, 18.5, cx + 0.95, 20.2);
    o.fillStyle = 'rgb(0,30,180)'; rect(o, cx - 0.95, 18.5, cx + 0.95, 20.2);
    if (rand() < 0.4) { e.fillStyle = litWin(e, R(0.5, 0.95), rand() < 0.8); rect(e, cx - 0.95, 18.5, cx + 0.95, 20.2); }
    for (const [ctx, col] of [[a, '#efe7d6'], [e, '#000'], [o, 'rgb(0,150,0)']]) { ctx.fillStyle = col; rect(ctx, cx - 0.05, 18.5, cx + 0.05, 20.2); rect(ctx, cx - 0.95, 19.32, cx + 0.95, 19.4); }
    a.strokeStyle = 'rgba(100,80,50,0.35)'; a.lineWidth = 3; a.strokeRect(X(cx - 2), Y(23.2), 4 * k, 1.8 * k);
  }
  grain(a, W, H, 14);
  const ts = { map: ctex(cA), em: ctex(cE), orm: ctex(cO, false) };
  return ts;
}

/* big glazed arch of the central portal: 19 m wide, 23.5 m high */
const PR = 9.5, PSPR = 14;
function portalTex() {
  const W = 1024, H = 1280, kx = W / (2 * PR), ky = H / (PSPR + PR);
  const cA = cnv(W, H), cE = cnv(W, H), a = cA.getContext('2d'), e = cE.getContext('2d');
  const X = x => (x + PR) * kx, Y = y => H - y * ky;
  const ag = a.createLinearGradient(0, 0, 0, H); ag.addColorStop(0, '#3a3024'); ag.addColorStop(1, '#2a2118'); a.fillStyle = ag; a.fillRect(0, 0, W, H);
  const eg = e.createLinearGradient(0, 0, 0, H); eg.addColorStop(0, '#c07838'); eg.addColorStop(0.55, '#e8a058'); eg.addColorStop(1, '#ffc27a');
  e.fillStyle = eg; e.fillRect(0, 0, W, H);
  // hall interior: dim columns and a gallery seen through the glass
  e.fillStyle = 'rgba(40,20,5,0.45)'; for (const cx of [-6.2, 6.2]) e.fillRect(X(cx - 0.7), Y(19), 1.4 * kx, 19 * ky);
  e.fillStyle = 'rgba(40,20,5,0.35)'; e.fillRect(0, Y(9.2), W, 0.6 * ky);
  // chandeliers
  for (const [cx, cy, r] of [[-3.6, 12.5, 2.6], [3.6, 12.5, 2.6], [0, 17.5, 3.2], [-6.5, 7.5, 1.8], [6.5, 7.5, 1.8]]) {
    const rg = e.createRadialGradient(X(cx), Y(cy), 0, X(cx), Y(cy), r * kx); rg.addColorStop(0, 'rgba(255,245,215,1)'); rg.addColorStop(0.25, 'rgba(255,214,150,0.75)'); rg.addColorStop(1, 'rgba(255,190,110,0)');
    e.fillStyle = rg; e.fillRect(0, 0, W, H);
  }
  // doors
  for (let i = -2; i <= 2; i++) { const cx = i * 3.2; e.fillStyle = 'rgba(255,236,200,0.9)'; e.fillRect(X(cx - 1.15), Y(4.1), 2.3 * kx, 4.1 * ky); a.fillStyle = '#5a4630'; a.fillRect(X(cx - 1.15), Y(4.1), 2.3 * kx, 4.1 * ky); }
  // bronze mullions
  for (const [ctx, col] of [[a, '#d8c8a8'], [e, '#140c04']]) {
    ctx.fillStyle = col; ctx.strokeStyle = col;
    for (let x = -PR; x <= PR + 0.01; x += 1.9) ctx.fillRect(X(x) - 3, 0, 6, H);
    for (let y = 2; y < PSPR; y += 2.0) ctx.fillRect(0, Y(y) - 2.5, W, 5);
    ctx.fillRect(0, Y(4.3) - 7, W, 14); ctx.fillRect(0, Y(PSPR) - 6, W, 12);

  for (const [p, n] of tramP) for (let i = 0; i < n; i++) BIG.push({ p, s0: i * p.L / n + R(0, 150), len: 27, col: '#c62a2a', tram: true });
}
const bigBody = new THREE.InstancedMesh(new THREE.BoxGeometry(2.5, 2.7, 1).translate(0, 1.85, 0), std({ roughness: 0.4, metalness: 0.4 }, 1.2), BIG.length);
const bigWin = new THREE.InstancedMesh(new THREE.BoxGeometry(2.56, 0.95, 0.94).translate(0, 2.3, 0), basic({ color: hdr('#ffe6b8', 1.6) }), BIG.length);
const bigRoof = new THREE.InstancedMesh(new THREE.BoxGeometry(2.3, 0.25, 0.92).translate(0, 3.3, 0), std({ color: 0xd8d8d4, roughness: 0.5 }), BIG.length);
const bigHead = new THREE.InstancedMesh(new THREE.BoxGeometry(2.0, 0.18, 0.04).translate(0, 0.95, 0.51), headMat, BIG.length);
{ const c = new THREE.Color(); BIG.forEach((b, i) => bigBody.setColorAt(i, c.set(b.col))); }
for (const m of [bigBody, bigWin, bigRoof, bigHead]) { m.frustumCulled = false; scene.add(m); }
const _o = new THREE.Object3D(), _pt = {};
function updateCars(t) {
  MOVING.forEach((c, i) => {
    const p = c.p; p.at(c.s0 + t * p.speed, _pt);
    let sc = 1; if (p.fade) sc = smooth(0, 14, _pt.d) * smooth(0, 14, p.L - _pt.d);
    _o.position.set(_pt.x, 0, _pt.z); _o.rotation.set(0, Math.atan2(_pt.dx, _pt.dz), 0); _o.scale.setScalar(Math.max(sc, 0.0001)); _o.updateMatrix();
    carBody.setMatrixAt(i, _o.matrix); carCab.setMatrixAt(i, _o.matrix); carHead.setMatrixAt(i, _o.matrix); carTail.setMatrixAt(i, _o.matrix); carBeam.setMatrixAt(i, _o.matrix);
    if (c.taxi) taxiSign.setMatrixAt(i, _o.matrix);
  });
  BIG.forEach((b, i) => {
    const p = b.p; p.at(b.s0 + t * p.speed, _pt);
    const sc = Math.max(0.0001, smooth(0, 20, _pt.d) * smooth(0, 20, p.L - _pt.d));
    _o.position.set(_pt.x, 0, _pt.z); _o.rotation.set(0, Math.atan2(_pt.dx, _pt.dz), 0); _o.scale.set(sc, sc, b.len * sc); _o.updateMatrix();
    bigBody.setMatrixAt(i, _o.matrix); bigWin.setMatrixAt(i, _o.matrix); bigRoof.setMatrixAt(i, _o.matrix);
    _o.scale.set(sc, sc, sc); _o.position.x += Math.sin(_o.rotation.y) * (b.len / 2 - 0.5); _o.position.z += Math.cos(_o.rotation.y) * (b.len / 2 - 0.5); _o.updateMatrix(); bigHead.setMatrixAt(i, _o.matrix);
  });
  for (const m of [carBody, carCab, carHead, carTail, carBeam, taxiSign, bigBody, bigWin, bigRoof, bigHead]) m.instanceMatrix.needsUpdate = true;
}

/* ---------- pedestrians ---------- */
const PEOPLE = [];
{
  const nWalk = Math.round(110 * Q.people), nWait = Math.round(90 * Q.people);
  for (let i = 0; i < nWalk; i++) { const x = R(-100, 100), z = R(12, 66); PEOPLE.push({ x, z, tx: R(-100, 100), tz: R(12, 66), sp: R(1.0, 1.6), y: 0, walk: true }); }
  for (let i = 0; i < nWait; i++) { const P = pick(PLATS); PEOPLE.push({ x: R(P.x0 + 10, P.x1 - 10), z: R(P.z0 + 1.6, P.z1 - 1.6), y: 1.2, walk: false }); }
  for (const p of PEOPLE) if (Math.abs(p.x) < 11 && p.z < 14) p.z += 6;
}
const peopleMesh = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.23, 1.15, 3, 6).translate(0, 0.82, 0), std({ roughness: 0.8 }, 0.6), PEOPLE.length);
{ const c = new THREE.Color(); PEOPLE.forEach((p, i) => peopleMesh.setColorAt(i, c.set(pick(['#2a2e36', '#3c3a38', '#5b2a2a', '#26384f', '#6a6258', '#1e2024', '#7a3c24', '#3e5a48', '#b9b2a2'])))); }
peopleMesh.frustumCulled = false; scene.add(peopleMesh);
function updatePeople(dt, t) {
  PEOPLE.forEach((p, i) => {
    if (p.walk) {
      const dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz);
      if (d < 0.6) { p.tx = R(-100, 100); p.tz = R(12, 66); if (Math.abs(p.tx) < 12 && rand() < 0.6) p.tz = R(10, 14); }
      else { const k = Math.min(d, p.sp * dt) / d; p.x += dx * k; p.z += dz * k; }
    }
    _o.position.set(p.x, p.y + (p.walk ? Math.abs(Math.sin(t * 7 + i)) * 0.05 : 0), p.z); _o.rotation.set(0, 0, 0); _o.scale.setScalar(1); _o.updateMatrix(); peopleMesh.setMatrixAt(i, _o.matrix);
  });
  peopleMesh.instanceMatrix.needsUpdate = true;
}

/* ---------- sky (night with the moon) ---------- */
const skyU = {
  uZen: { value: new THREE.Color('#020611') }, uHor: { value: new THREE.Color('#131b33') }, uGlow: { value: new THREE.Color('#4a2c2a') }, uSun: { value: new THREE.Color('#c4d0f4') },
  uSunDir: { value: new THREE.Vector3(-0.32, 0.27, -0.91).normalize() }, uGk: { value: 0.55 }, uSunVis: { value: 0.32 }, uStars: { value: 0.95 }, uTime: { value: 0 }
};
const skyVS = `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const skyFS = `uniform vec3 uZen,uHor,uGlow,uSun,uSunDir; uniform float uGk,uSunVis,uStars,uTime,uDisk; varying vec3 vDir;
float h13(vec3 p){ p=fract(p*.1031); p+=dot(p,p.zyx+31.32); return fract((p.x+p.y)*p.z); }
void main(){
  vec3 d=normalize(vDir); float y=d.y; float h=clamp(y,0.0,1.0);
  vec3 col=mix(uHor,uZen,pow(h,0.5));
  col+=uGlow*uGk*exp(-abs(y)*9.0)*0.6;
  float mu=max(dot(d,uSunDir),0.0);
  col+=uSun*uSunVis*(pow(mu,16.0)*0.12+pow(mu,200.0)*0.5);
  float disk=smoothstep(0.99975,0.99988,mu);
  vec3 mp=d-uSunDir*mu; float crater=0.86+0.14*sin(mp.x*900.0)*sin(mp.y*700.0+1.3);
  col+=uSun*disk*uDisk*crater;
  if(y<0.0) col=mix(col,uHor*0.4+uGlow*uGk*0.04,smoothstep(0.0,0.2,-y));
  if(uStars>0.0 && y>0.02){ vec3 c=d*300.0; vec3 id=floor(c); vec3 f=fract(c)-0.5; float r=h13(id);
    if(r>0.985){ float s=smoothstep(0.28,0.0,length(f))*(r-0.985)/0.015; s*=0.7+0.3*sin(uTime*3.0+r*500.0); col+=vec3(0.9,0.95,1.0)*s*uStars*2.6*smoothstep(0.02,0.25,y)*(1.0-disk);} }
  gl_FragColor=vec4(col,1.0);
}`;
const skyMat = new THREE.ShaderMaterial({ uniforms: { ...skyU, uDisk: { value: 3.2 } }, vertexShader: skyVS, fragmentShader: skyFS, side: THREE.BackSide, depthWrite: false, depthTest: false });
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 48, 24), skyMat); sky.renderOrder = -1000; sky.frustumCulled = false; scene.add(sky);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), new THREE.ShaderMaterial({ uniforms: { ...skyU, uDisk: { value: 0.5 } }, vertexShader: skyVS, fragmentShader: skyFS, side: THREE.BackSide, depthWrite: false })));
// warm "city light" patches in the environment so the gold and glass have something to reflect
for (const [x, y, z, s, c] of [[0, 6, 40, 16, '#ffb060'], [-36, 4, 20, 10, '#ff9a4a'], [36, 4, 20, 10, '#ff9a4a'], [0, -10, 0, 30, '#6a4a30'], [30, 10, -30, 8, '#c0d0ff']]) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), new THREE.MeshBasicMaterial({ color: hdr(c, 1.6) })); m.position.set(x, y, z); envScene.add(m);
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(envScene, 0, 0.1, 200).texture;

/* ---------- lights ---------- */
const MOON = new THREE.Vector3(-0.35, 0.78, -0.52).normalize();
const moon = new THREE.DirectionalLight(0x9fb2e0, 0.32);
moon.castShadow = true; moon.shadow.mapSize.set(Q.shadow, Q.shadow);
Object.assign(moon.shadow.camera, { left: -330, right: 330, top: 330, bottom: -330, near: 10, far: 2200 });
moon.shadow.bias = -0.0004; moon.shadow.normalBias = 0.6;
moon.target.position.set(0, 0, -10); moon.position.copy(moon.target.position).addScaledVector(MOON, 1000); scene.add(moon, moon.target);
const hemi = new THREE.HemisphereLight(0x26365a, 0x0a0908, 0.42); scene.add(hemi);
// floodlights on the square aimed at the tower and the portal (no shadows — cheap)
for (const [p, t, ang, I, col] of [
  [[-34, 7.5, 46], [0, 56, TZ], 0.26, 4200, '#ffd2a0'], [[34, 7.5, 46], [0, 56, TZ], 0.26, 4200, '#ffd2a0'],
  [[0, 7.5, 54], [0, 16, 7], 0.42, 2600, '#ffc890'],
  [[-62, 9, 40], [-62, 14, 0], 0.55, 2600, '#ffcc96'], [[62, 9, 40], [62, 14, 0], 0.55, 2600, '#ffcc96']]) {
  const L = new THREE.SpotLight(col, I, 0, ang, 0.6, 2); L.position.set(...p); L.target.position.set(...t); scene.add(L, L.target);
}

for (const m of MATS) m.envMapIntensity = 0.35 * m.userData.envK;
renderer.toneMappingExposure = 1.15;
scene.fog.color.copy(skyU.uGlow.value).multiplyScalar(skyU.uGk.value * 0.6).add(skyU.uHor.value);
FOGU.c.value.copy(scene.fog.color).multiplyScalar(1.25);

/* ---------- post ---------- */
const rt = new THREE.WebGLRenderTarget(innerWidth * Q.pr, innerHeight * Q.pr, { type: THREE.HalfFloatType, samples: Q.msaa });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
  void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 q=vUv-0.5; float v=smoothstep(0.95,0.28,length(q*vec2(1.0,0.92))); c.rgb*=mix(0.72,1.0,v);
  float n=fract(sin(dot(vUv*vec2(1731.0,977.0)+fract(uTime)*13.0,vec2(12.9898,78.233)))*43758.5453); c.rgb+=(n-0.5)*0.02; gl_FragColor=c; }`
});
composer.addPass(grade);

/* ---------- controls & camera moves ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.maxPolarAngle = 1.42; controls.minDistance = 45; controls.maxDistance = 900;
controls.autoRotateSpeed = reduceMotion ? 0.2 : 0.6; controls.screenSpacePanning = true;
const VIEWS = {
  drone: { p: [128, 64, 196], t: [0, 26, -8] },
  facade: { p: [0, 14, 150], t: [0, 32, 0] },
  tower: { p: [46, 52, 64], t: [0, 50, -6] },
  tracks: { p: [-150, 40, -190], t: [10, 8, -50] },
  platform: { p: [-70, 13, -112], t: [20, 4, -46] },
  back: { p: [-120, 58, -235], t: [0, 16, -30] },
  square: { p: [180, 150, 330], t: [0, 0, 20] },
};
function viewVec(name) {
  const v = VIEWS[name] || VIEWS.drone, p = new THREE.Vector3(...v.p), t = new THREE.Vector3(...v.t), asp = innerWidth / innerHeight;
  if (asp < 0.9) p.sub(t).multiplyScalar(1.35).add(t);
  return { p, t };
}
let tween = null;
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function flyTo(name, dur = 2.4) {
  const { p, t } = viewVec(name);
  controls.autoRotate = false;
  if (reduceMotion) { camera.position.copy(p); controls.target.copy(t); tween = null; lastTouch = performance.now() - 1500; return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: p, t1: t, k: 0, dur };
}
let lastTouch = -1e9;
controls.addEventListener('start', () => { tween = null; controls.autoRotate = false; lastTouch = performance.now(); });
controls.addEventListener('end', () => { lastTouch = performance.now(); });
renderer.domElement.addEventListener('wheel', () => { lastTouch = performance.now(); controls.autoRotate = false; }, { passive: true });
setTimeout(() => { $('#hint').style.opacity = 0; }, 9000);

/* ---------- вбудовування в головний сайт (iframe) ---------- */
const QS = new URLSearchParams(location.search);
const EMBED = QS.has('embed');
if (EMBED) document.body.classList.add('embed');
let SHIFT = 0, PAUSED = QS.has('paused');
// клавіші (стрілки, пробіл, Esc…) передаємо головному сайту, щоб клікер працював і тут
if (EMBED) addEventListener('keydown', (e) => {
  if (['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Escape', 'f', 'F', '1', '2', '3', '4', '5', '6', '7'].includes(e.key)) {
    e.preventDefault(); parent.postMessage({ key: e.key }, '*');
  }
});
addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.shift !== undefined) { SHIFT = +d.shift || 0; document.body.style.setProperty('--card', (SHIFT * 2) + 'px'); onResize(); }
  if (d.view) flyTo(VIEWS[d.view] ? d.view : 'drone', d.instant ? 0.01 : 2.6);
  if (d.paused !== undefined) { const was = PAUSED; PAUSED = !!d.paused; if (!PAUSED) { clock.getDelta(); if (was) hornNext = Math.min(hornNext, T + 1.2); } } // повернулись на вокзал — гудок
});

function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = w / h < 0.9 ? 52 : 36; camera.updateProjectionMatrix();
  if (SHIFT) camera.setViewOffset(w, h, SHIFT, 0, w, h); else camera.clearViewOffset();
  renderer.setSize(w, h); composer.setSize(w, h);
}
addEventListener('resize', onResize);

/* ---------- start ---------- */
if (QS.has('shift')) { SHIFT = +QS.get('shift'); document.body.style.setProperty('--card', (SHIFT * 2) + 'px'); }
const START_VIEW = VIEWS[QS.get('view')] ? QS.get('view') : 'drone';
onResize();
renderer.shadowMap.needsUpdate = true;
{
  const { p, t } = viewVec(START_VIEW);
  if (reduceMotion || QS.has('nointro')) { camera.position.copy(p); controls.target.copy(t); lastTouch = QS.has('hold') ? 1e15 : performance.now() - 1500; }
  else { camera.position.set(-430, 300, 720); controls.target.set(0, 20, -30); tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: p, t1: t, k: 0, dur: 6 }; }
}
const clock = new THREE.Clock();
let T = +QS.get('tt') || 0, first = true;
function frame() {
  requestAnimationFrame(frame);
  if (PAUSED) return;
  tick(Math.min(clock.getDelta(), 0.05));
}
function tick(dt) {
  T += dt;
  if (tween) {
    tween.k = Math.min(1, tween.k + dt / tween.dur); const e = ease(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) { tween = null; controls.autoRotate = true; }
  }
  // камера ніколи не стоїть: після дотику через 2,5 с знову повільно облітає вокзал
  if (!tween && !controls.autoRotate && performance.now() - lastTouch > 2500) controls.autoRotate = true;
  controls.update(dt);
  controls.target.x = clamp(controls.target.x, -320, 320); controls.target.z = clamp(controls.target.z, -260, 320); controls.target.y = clamp(controls.target.y, 0, 90);
  if (camera.position.y < 4) camera.position.y = 4;
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  FOGU.v.value.copy(skyU.uSunDir.value).transformDirection(camera.matrixWorldInverse);
  skyU.uTime.value = T; grade.uniforms.uTime.value = T;
  updateCars(T); updateTrains(T); hornTick(T); updatePeople(dt, T); updateClocks();
  for (const f of FLAGS) {
    const pos = f.geometry.attributes.position, base = f.userData.base;
    for (let i = 0; i < pos.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1], k = x / 5.4;
      pos.setZ(i, (Math.sin(x * 1.1 - T * 5.0 + f.userData.ph) * 0.38 + Math.sin(x * 2.1 - T * 7.4 + y * 0.6) * 0.1) * k);
      pos.setY(i, y - k * k * 0.22);
    }
    pos.needsUpdate = true; f.geometry.computeVertexNormals();
  }
  composer.render();
  if (first) { first = false; const L = $('#loader'); L.style.opacity = 0; L.style.pointerEvents = 'none'; if (QS.has('hold')) L.style.display = 'none'; else setTimeout(() => { L.style.display = 'none'; }, 950); }
}
frame();

window.__three = { renderer, scene, camera, composer }; // для діагностики
autoQuality({ renderer, composer, onResize, name: 'vokzal' });
/* ---------- клавіша C: показати координати камери (щоб передати бажаний ракурс) ---------- */
addEventListener('keydown', (e) => {
  if (!['c', 'C', 'с', 'С'].includes(e.key)) return;
  const r = (v) => [v.x, v.y, v.z].map((n) => Math.round(n)).join(', ');
  let box = document.getElementById('camInfo');
  if (!box) { box = document.createElement('div'); box.id = 'camInfo'; box.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.8);color:#ffd43b;font:600 15px monospace;padding:10px 16px;border-radius:12px;user-select:all'; document.body.appendChild(box); }
  box.textContent = `${document.title} — камера: [${r(camera.position)}]  ціль: [${r(controls.target)}]`;
  clearTimeout(box._h); box._h = setTimeout(() => box.remove(), 15000);
});
</script>
