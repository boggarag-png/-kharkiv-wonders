  function fail(msg) {
    var m = document.getElementById('loadmsg'), L = document.getElementById('loader');
    if (m) { m.textContent = 'Не вдалося запустити 3D-сцену: ' + (msg || 'невідома помилка'); m.className = 'err'; }
    if (L) { L.hidden = false; L.style.display = ''; L.style.opacity = 1; L.style.pointerEvents = 'auto'; }
  }
  window.__errs = []; var ce = console.error; console.error = function () { try { window.__errs.push([].join.call(arguments, ' ').slice(0, 300)); } catch (e) {} return ce.apply(console, arguments); };
  addEventListener('error', function (e) { fail(e.message); });
  addEventListener('unhandledrejection', function (e) { fail(e.reason && e.reason.message ? e.reason.message : String(e.reason)); });
})();

const $ = s => document.querySelector(s);

const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const rand = mulberry32(18881901);
const R = (a, b) => a + (b - a) * rand();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rand() * arr.length)];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 640 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 900); // велика сенсорна дошка — повна якість
// великі інтерактивні дошки (4K) — обмежуємо кількість пікселів, щоб не гальмувало
const PRCAP = Math.sqrt(8.3e6 / Math.max(1, innerWidth * innerHeight));
const Q = small
  ? { shadow: 2048, trees: 0.55, pr: Math.min(devicePixelRatio, 1.5, PRCAP), plan: 2048, msaa: 0, refl: 0.38, snow: 1800, birds: 26 }

/* ---------- directional, moon-tinted fog (aerial perspective) ---------- */
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying float vFogDepth; varying vec3 vFogView;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
vFogDepth = - mvPosition.z; vFogView = mvPosition.xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
uniform vec3 fogColor; varying float vFogDepth; varying vec3 vFogView;
uniform vec3 uFogSunView; uniform vec3 uFogSunColor;
#ifdef FOG_EXP2
uniform float fogDensity;
#else
uniform float fogNear; uniform float fogFar;
#endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
#ifdef FOG_EXP2
float fogFactor = 1.0 - exp( - fogDensity * fogDensity * vFogDepth * vFogDepth );
#else
float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
#endif
float fogSun = pow( max( dot( normalize( vFogView ), uFogSunView ), 0.0 ), 5.0 );
gl_FragColor.rgb = mix( gl_FragColor.rgb, mix( fogColor, uFogSunColor, fogSun ), fogFactor );
#endif`;
const FOGU = { v: { value: new THREE.Vector3(0, 0, -1) }, c: { value: new THREE.Color() } };
const fogPatch = s => { s.uniforms.uFogSunView = FOGU.v; s.uniforms.uFogSunColor = FOGU.c; };
const MATS = [];
function std(p, envK = 1) { const m = new THREE.MeshStandardMaterial(p); m.onBeforeCompile = fogPatch; m.userData.envK = envK; MATS.push(m); return m; }
function basic(p) { const m = new THREE.MeshBasicMaterial(p); m.onBeforeCompile = fogPatch; return m; }
const hdr = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

/* спільні «живі» величини для шейдерів */
const FLOOD = { value: 0.5 }, BELL = { value: 0 }, TIME = { value: 0 }, FLAP = { value: 0 };

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('#stage').appendChild(renderer.domElement);
const MAXANI = Math.min(16, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1020, 0.00112);
const camera = new THREE.PerspectiveCamera(innerWidth / innerHeight < 0.9 ? 52 : 36, innerWidth / innerHeight, 1, 9000);

/* ---------- canvas texture helpers ---------- */
function cnv(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctex(c, srgb = true, repeat = true) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAXANI; t.needsUpdate = true; return t;
}
function grain(ctx, w, h, amt) {
  const d = ctx.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const n = (rand() - 0.5) * amt; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  ctx.putImageData(d, 0, 0);

const noiseCanvas = (() => { const c = cnv(256), g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256); grain(g, 256, 256, 70); return c; })();

/* червоно-білі смуги: 1 м = 0,34 м білого каменю + 8 рядів червоної цегли; 1 текстура = 4 х 4 м */
function brickTex() {
  const S = 1024, M = S / 4, c = cnv(S), a = c.getContext('2d');
  a.fillStyle = '#6a4134'; a.fillRect(0, 0, S, S);
  for (let m = 0; m < 4; m++) {
    const y0 = m * M, wb = 0.29 * M, by0 = y0 + wb, rows = 8, rh = (M - wb) / rows, bl = 0.25 * M;
    for (let r = 0; r < rows; r++) {
      const yy = by0 + r * rh, off = (r % 2) * bl / 2;
      for (let x = -off; x < S; x += bl) {
        let cr = R(150, 176), cg = R(40, 54), cb = R(30, 40);
        if (rand() < 0.1) { cr *= 0.76; cg *= 0.8; cb *= 0.86; }
        a.fillStyle = `rgb(${cr | 0},${cg | 0},${cb | 0})`;
        a.fillRect(x + 1.6, yy + 1.6, bl - 3.2, rh - 3.2);
      }

    // біла кам'яна смуга з розшивкою
    a.fillStyle = '#efe7d6'; a.fillRect(0, y0, S, wb);
    a.fillStyle = 'rgba(255,255,250,0.5)'; a.fillRect(0, y0, S, 3);
    const sl = 0.62 * M;
    a.fillStyle = 'rgba(120,100,80,0.32)';
    a.fillRect(0, y0 + wb / 2 - 1, S, 2);
    for (let row = 0; row < 2; row++) { const so = R(0, sl); for (let x = -so; x < S; x += sl) a.fillRect(x, y0 + row * wb / 2, 2, wb / 2); }

  }
  for (let i = 0; i < 140; i++) { a.fillStyle = rand() < 0.6 ? `rgba(40,20,10,${R(.03,.07)})` : `rgba(255,240,220,${R(.02,.05)})`; a.beginPath(); a.arc(R(0, S), R(0, S), R(20, 110), 0, 7); a.fill(); }

}
function stoneTex(col = '#ebe5d8') { const c = cnv(512), g = c.getContext('2d'); g.fillStyle = col; g.fillRect(0, 0, 512, 512); grain(g, 512, 512, 18);
  for (let i = 0; i < 70; i++) { g.fillStyle = rand() < 0.5 ? `rgba(110,100,86,${R(.03,.07)})` : `rgba(255,252,244,${R(.03,.08)})`; g.beginPath(); g.arc(R(0, 512), R(0, 512), R(20, 90), 0, 7); g.fill(); }
  return ctex(c); }
function roofTex() { const c = cnv(256), g = c.getContext('2d'); g.fillStyle = '#7c8580'; g.fillRect(0, 0, 256, 256); grain(g, 256, 256, 34);
  g.strokeStyle = 'rgba(0,0,0,0.2)'; g.lineWidth = 2; for (let i = 0; i < 256; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke(); } return ctex(c); }
/* бані: сіро-зелений метал з ребрами (1 ребро на плитку по горизонталі) */
function domeTex() {
  const c = cnv(128, 512), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 128, 0); gr.addColorStop(0, '#557d77'); gr.addColorStop(0.5, '#86aea6'); gr.addColorStop(1, '#557d77');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 512);
  g.fillStyle = 'rgba(20,40,36,0.35)'; for (let y = 0; y < 512; y += 44) g.fillRect(0, y, 128, 2);
  g.fillStyle = '#b9d6cd'; g.fillRect(0, 0, 6, 512); g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(6, 0, 4, 512);
  grain(g, 128, 512, 12); return ctex(c);

function radialTex(stops) { const c = cnv(128), g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); stops.forEach(([p, col]) => r.addColorStop(p, col)); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return ctex(c, true, false); }
function starTex() {
  const S = 256, c = cnv(S), g = c.getContext('2d'), h = S / 2;
  const r = g.createRadialGradient(h, h, 0, h, h, h); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.08, 'rgba(255,236,190,0.9)'); r.addColorStop(0.3, 'rgba(255,200,120,0.18)'); r.addColorStop(1, 'rgba(255,190,110,0)');

/* безшовна карта нормалей для брижів на воді */
function waterNormalTex() {
  const N = 256, c = cnv(N), g = c.getContext('2d'), img = g.createImageData(N, N), W = [];
  for (let i = 0; i < 30; i++) { let fx = RI(-10, 10), fy = RI(-10, 10); if (!fx && !fy) fx = 1; const f = Math.hypot(fx, fy); W.push([fx, fy, R(0.5, 1) / Math.pow(f, 1.15), R(0, 6.283)]); }

/* житлові квартали: 8x8 клітинок, клітинка = 3,2 м x 3,0 м */
function cityAtlas() {
  const S = 512, N = 8, C = S / N;
  const cA = cnv(S), cE = cnv(S), a = cA.getContext('2d'), e = cE.getContext('2d');

/* ---------- materials ---------- */
const brickMat = std({ map: BRICK, roughness: 0.86 });
const whiteMat = std({ map: STONE, color: 0xf7f0e2, roughness: 0.72 });
const graniteMat = std({ map: GRAN, color: 0xb0a89c, roughness: 0.6 });
const roofMat = std({ map: ROOF, color: 0x8fb0a8, roughness: 0.42, metalness: 0.55 }, 1.2);
const domeMat = std({ map: DOMET, roughness: 0.3, metalness: 0.62 }, 1.5);
const goldMat = std({ color: 0xeab654, metalness: 1, roughness: 0.2, emissive: 0x8a5a14, emissiveIntensity: 0.85 }, 2.2);
const bronzeMat = std({ color: 0xb98a36, metalness: 1, roughness: 0.34, emissive: 0x3a2208, emissiveIntensity: 0.7, side: THREE.DoubleSide }, 1.6);
const darkMat = std({ color: 0x140e0a, roughness: 1 }, 0.3);
const stoneMat = std({ map: GRAN, color: 0xc9c2b6, roughness: 0.7 }, 0.6);
const cityMat = std({ map: CA.map, emissiveMap: CA.em, emissive: 0xffffff, emissiveIntensity: 1.35, roughness: 0.8 });
const cityRoofMat = std({ map: ROOF, roughness: 0.95 });

/* ---------- тепле підсвічування фасадів прожекторами (запечене в матеріал) ---------- */
function addFlood(m, k = 1, mode = 'wall') {

composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
  void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 q=vUv-0.5; float v=smoothstep(0.95,0.28,length(q*vec2(1.0,0.92))); c.rgb*=mix(0.7,1.0,v);
  float n=fract(sin(dot(vUv*vec2(1731.0,977.0)+fract(uTime)*13.0,vec2(12.9898,78.233)))*43758.5453); c.rgb+=(n-0.5)*0.02; gl_FragColor=c; }`
});
composer.addPass(grade);

/* ---------- controls & camera moves ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.maxPolarAngle = 1.8; controls.minDistance = 30; controls.maxDistance = 800;
controls.autoRotateSpeed = reduceMotion ? 0.2 : 0.6; controls.screenSpacePanning = true;
const VIEWS = {
  drone: { p: [80, 20, 172], t: [-12, 27, 0] },
  facade: { p: [-4, 6, 150], t: [-8, 30, 0] },
  tower: { p: [8, 34, 82], t: [TX, 48, 0] },
  river: { p: [292, -11, 94], t: [-14, -4, 12] },
  domes: { p: [52, 52, 66], t: [0, 46, 0] },
  bridge: { p: [-228, -4, 108], t: [-100, 6, 60] },
  panorama: { p: [330, 140, 430], t: [-10, 10, 20] },
};
function viewVec(name) {
  const v = VIEWS[name] || VIEWS.drone, p = new THREE.Vector3(...v.p), t = new THREE.Vector3(...v.t), asp = innerWidth / innerHeight;
  if (asp < 0.9) p.sub(t).multiplyScalar(1.35).add(t);
  return { p, t };
}
let tween = null;
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function flyTo(name, dur = 2.4) {
  const { p, t } = viewVec(name);
  controls.autoRotate = false;
  if (reduceMotion) { camera.position.copy(p); controls.target.copy(t); tween = null; lastTouch = performance.now() - 1500; return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: p, t1: t, k: 0, dur };
}
let lastTouch = -1e9;
controls.addEventListener('start', () => { tween = null; controls.autoRotate = false; lastTouch = performance.now(); });
controls.addEventListener('end', () => { lastTouch = performance.now(); });
renderer.domElement.addEventListener('wheel', () => { lastTouch = performance.now(); controls.autoRotate = false; }, { passive: true });
setTimeout(() => { $('#hint').style.opacity = 0; }, 11000);

/* ---------- дотик до дзвіниці ---------- */
const towerProxy = new THREE.Mesh(new THREE.BoxGeometry(17, 82, 17)); towerProxy.position.set(TX, 40, 0); towerProxy.updateMatrixWorld();
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hitTower = (x, y) => { const r = renderer.domElement.getBoundingClientRect(); ndc.set((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); return ray.intersectObject(towerProxy, false).length > 0; };
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; sfxAudio(); });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return; const d = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (d < 12 && dt < 600 && hitTower(e.clientX, e.clientY)) ring(true);
});
renderer.domElement.addEventListener('pointermove', e => { if (e.buttons || e.pointerType !== 'mouse') return; renderer.domElement.style.cursor = hitTower(e.clientX, e.clientY) ? 'pointer' : ''; });
addEventListener('keydown', () => sfxAudio());

/* ---------- вбудовування в головний сайт (iframe) ---------- */
const QS = new URLSearchParams(location.search);
const EMBED = QS.has('embed');
if (EMBED) document.body.classList.add('embed');
let SHIFT = 0, VSHIFT = +QS.get('vshift') || 0, PAUSED = QS.has('paused');
// клавіші (стрілки, пробіл, Esc…) передаємо головному сайту, щоб клікер працював і тут
if (EMBED) addEventListener('keydown', (e) => {
  if (['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Escape', 'f', 'F', '1', '2', '3', '4', '5', '6', '7'].includes(e.key)) {
    e.preventDefault(); parent.postMessage({ key: e.key }, '*');
  }
});
addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.vshift !== undefined) { VSHIFT = +d.vshift || 0; onResize(); }
  if (d.shift !== undefined) { SHIFT = +d.shift || 0; document.body.style.setProperty('--card', (SHIFT * 2) + 'px'); onResize(); }
  if (d.view) flyTo(VIEWS[d.view] ? d.view : 'drone', d.instant ? 0.01 : 2.6);
  if (d.paused !== undefined) { const was = PAUSED; PAUSED = !!d.paused; if (!PAUSED) { clock.getDelta(); if (was) nextAuto = Math.min(nextAuto, T + 1.2); } } // повернулись до собору — дзвін
});

function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = w / h < 0.9 ? 52 : 36; camera.updateProjectionMatrix();
  if (SHIFT || VSHIFT) camera.setViewOffset(w, h, SHIFT, VSHIFT, w, h); else camera.clearViewOffset();
  renderer.setSize(w, h); composer.setSize(w, h);
  reflRT.setSize(Math.max(4, Math.round(w * Q.pr * Q.refl)), Math.max(4, Math.round(h * Q.pr * Q.refl)));
  snow.material.uniforms.uScale.value = h * Q.pr / (2 * Math.tan(camera.fov * D2R / 2));
}
addEventListener('resize', onResize);

/* ---------- start ---------- */
if (QS.has('shift')) { SHIFT = +QS.get('shift'); document.body.style.setProperty('--card', (SHIFT * 2) + 'px'); }
const START_VIEW = VIEWS[QS.get('view')] ? QS.get('view') : 'drone';
onResize();
renderer.shadowMap.needsUpdate = true;
{
  const { p, t } = viewVec(START_VIEW);
  if (reduceMotion || QS.has('nointro')) { camera.position.copy(p); controls.target.copy(t); lastTouch = QS.has('hold') ? 1e15 : performance.now() - 1500; }
  else { camera.position.set(520, 230, 760); controls.target.set(-20, 20, 0); tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: p, t1: t, k: 0, dur: 6.5 }; }
}
const clock = new THREE.Clock();
let T = +QS.get('tt') || 0, first = true;
if (QS.has('tt')) nextAuto = T + 9;
window.sobor = { ring: () => ring(true), view: (v) => flyTo(VIEWS[v] ? v : 'drone', 0.01), dbg: DBG, state: () => ({ T: +T.toFixed(2), bell: +BELL.value.toFixed(3), peal: +pealStart.toFixed(2), audio: AC ? AC.state : 'none' }) };
function frame() {
  requestAnimationFrame(frame);
  if (PAUSED) return;
  const raw = clock.getDelta(); tick(Math.min(raw, 0.05), Math.min(raw, 0.25));
}
function tick(dt, rdt = dt) {
  T += dt; TIME.value = T;
  if (tween) {
    tween.k = Math.min(1, tween.k + rdt / tween.dur); const e = ease(tween.k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) { tween = null; controls.autoRotate = true; }
  }
  // камера ніколи не стоїть: після дотику через 2,5 с знову повільно облітає собор
  if (!tween && !controls.autoRotate && performance.now() - lastTouch > 2500) controls.autoRotate = true;
  controls.update(dt);
  controls.target.x = clamp(controls.target.x, -400, 400); controls.target.z = clamp(controls.target.z, -400, 400); controls.target.y = clamp(controls.target.y, -12, 90);
  const gy = Math.max(groundY(camera.position.x, camera.position.z), WY, roofY(camera.position.x, camera.position.z)) + 3;
  if (camera.position.y < gy) camera.position.y = gy;
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  FOGU.v.value.copy(skyU.uSunDir.value).transformDirection(camera.matrixWorldInverse);
  grade.uniforms.uTime.value = T; water.material.uniforms.uTime.value = T;
  snow.material.uniforms.uCam.value.copy(camera.position);
  // дзвони: автоматично кожні ~20 с і на дотик
  if (!QS.has('nobells') && T > nextAuto) ring(false);
  for (let i = VQ.length - 1; i >= 0; i--) if (T >= VQ[i].t) { strike(VQ[i].k); VQ.splice(i, 1); }
  BELLFX *= Math.exp(-dt * 1.5); BELL.value = BELLFX;
  SCAT = Math.max(0, SCAT - dt * 0.09);
  belfryLight.intensity = 90 + 1400 * BELLFX;
  bloom.strength = 0.8 + 0.22 * BELLFX;
  for (const b of BELLS) { b.amp *= Math.exp(-dt * 0.45); b.piv.rotation.x = Math.sin(T * (3.2 / Math.sqrt(b.s)) + b.ph) * b.amp; }
  for (const s of GLS) { const u = s.userData, k = Math.pow(Math.max(0, Math.sin(T * u.sp + u.ph)), 30); const sc = u.base * (0.45 + 1.8 * k + 2.2 * BELLFX); s.scale.setScalar(sc); }
  updateRings(); updateCars(T); updateBirds(dt, T);
  renderReflection();
  composer.render();
  if (first) { first = false; const L = $('#loader'); L.style.opacity = 0; L.style.pointerEvents = 'none'; if (QS.has('hold')) L.hidden = true; else setTimeout(() => { L.hidden = true; }, 950); }
}
frame();

window.__three = { renderer, scene, camera, composer }; // для діагностики
autoQuality({ renderer, composer, onResize, name: 'sobor' });
/* ---------- клавіша C: показати координати камери (щоб передати бажаний ракурс) ---------- */
addEventListener('keydown', (e) => {
  if (!['c', 'C', 'с', 'С'].includes(e.key)) return;
  const r = (v) => [v.x, v.y, v.z].map((n) => Math.round(n)).join(', ');
  let box = document.getElementById('camInfo');
  if (!box) { box = document.createElement('div'); box.id = 'camInfo'; box.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.8);color:#ffd43b;font:600 15px monospace;padding:10px 16px;border-radius:12px;user-select:all'; document.body.appendChild(box); }
  box.textContent = `${document.title} — камера: [${r(camera.position)}]  ціль: [${r(controls.target)}]`;
  clearTimeout(box._h); box._h = setTimeout(() => box.remove(), 15000);
});</script>
